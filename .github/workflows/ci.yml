name: Synthetic smoke and integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and research dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,tuning,repro]"
      - name: Check syntax, clean notebooks and content hashes
        run: python scripts/verify_repository.py
      - name: Selected synthetic tests only
        run: >-
          python -m pytest
          tests/test_models.py tests/test_evaluation.py tests/test_trip_pooling.py
          tests/test_stage13_persistence_forecast.py tests/test_stage13b_recent_methods.py
          tests/test_stage13c_timepro.py tests/test_stage15_remote.py
      - name: Record this remote environment
        if: always()
        run: |
          python --version > ci-python-version.txt
          python -m pip freeze > ci-requirements-freeze.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: remote-smoke-environment
          path: ci-*.txt
