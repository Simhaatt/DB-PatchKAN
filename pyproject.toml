[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbpatchkan"
version = "0.1.0"
description = "Driver-battery dual-stream patch Transformer with concept KAN and explainable driving battery stress index"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "xgboost>=2.1",
  "shap>=0.46",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "scipy>=1.11",
  "psutil>=5.9",
]

[project.optional-dependencies]
repro = ["matplotlib>=3.8", "pillow>=10", "nbformat>=5.10", "jsonschema>=4"]
explain = ["interpret>=0.6", "hdbscan>=0.8.40", "statsmodels>=0.14"]
tuning = ["optuna>=4.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
dbpatchkan = "dbpatchkan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
